# 模型路径配置
dit = "/workspace/models/qwen_image_edit_bf16.safetensors"  # Qwen-Image-Edit的DiT模型路径
vae = "/workspace/models/qwen_image_vae.safetensors"            # VAE模型路径
text_encoder = "/workspace/models/qwen_2.5_vl_7b.safetensors"  # Qwen2.5-VL文本编码器路径
dataset_config = "/workspace/setting/qwen-image-edit-setting.toml"  # 数据集配置文件路径

# 网络配置（LoRA）
network_module = "networks.lora_qwen_image"  # Qwen-Image专用LoRA模块
network_dim = 16  # LoRA维度（推荐16，显存充足可增至32）

# 训练参数
mixed_precision = "bf16"  # 混合精度训练（推荐bf16，需GPU支持）
timestep_sampling = "shift"  # 时间步采样方式
discrete_flow_shift = 2.2  # 离散流偏移值（Qwen-Image推荐2.2）
max_train_epochs = 16  # 最大训练轮数
save_every_n_epochs = 1  # 每N轮保存一次模型
seed = 42  # 随机种子
gradient_checkpointing = true  # 启用梯度检查点（节省显存）

# 优化器配置
optimizer_type = "adamw8bit"  # 8位AdamW优化器（节省显存）
learning_rate = 5e-5  # 学习率（Qwen-Image-Edit推荐5e-5）

# 数据加载配置
max_data_loader_n_workers = 2  # 数据加载线程数
persistent_data_loader_workers = true  # 保持数据加载线程存活

# 输出配置
output_dir = "/workspace/output"  # 输出目录
output_name = "qwenedit-人物重绘为动漫图-v1"  # 模型保存名称

# 编辑模式配置（Qwen-Image-Edit必填）
edit = true  # 启用编辑模式（Edit模型）
# edit_plus = true  # 若使用Edit-2509模型，启用此选项（二选一）

#显存设置，后添加
blocks_to_swap = 24
